<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puntos Móviles en Grid</title>
    <style>
        body {
            /*display: flex;*/
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
        }
        
        canvas {
            border: 2px solid #333;
            background-color: white;
            cursor: grab;
        }
        
        canvas:active {
            cursor: grabbing;
        }
    </style>
</head>
<body>
<p>Experimentando con segmentos móviles y con puntos que se pueden arrastrar a las posiciones de una rejilla</p>
<p>Más o menos funciona bien. Ahora tengo que implementarlo con segmentos móviles dependientes de las coordenadas de sus extremos   </p>

    <canvas id="canvas" style="margin:auto; display:block"></canvas>
    
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        canvas.width = 600;
        canvas.height = 600;
        
        const gridSize = 80;
        const pointRadius = 8;
        const gridPoints = [];
        
        // Generate fixed grid points
        for (let x = gridSize; x < canvas.width; x += gridSize) {
            for (let y = gridSize; y < canvas.height; y += gridSize) {
                gridPoints.push({ x, y });
            }
        }
        
        // Draggable point
        let draggablePoint = { x: gridPoints[0].x, y: gridPoints[0].y };
        let originalPoint = { ...draggablePoint };
        let isDragging = false;
        
        function findNearestGridPoint(x, y) {
            let nearest = gridPoints[0];
            let minDistance = Infinity;
            
            gridPoints.forEach(point => {
                const distance = Math.hypot(point.x - x, point.y - y);
                if (distance < minDistance) {
                    minDistance = distance;
                    nearest = point;
                }
            });
            
            return minDistance < gridSize / 3 ? nearest : null;
        }
        
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw grid points
            ctx.fillStyle = '#cccccc';
            gridPoints.forEach(point => {
                ctx.beginPath();
                ctx.arc(point.x, point.y, pointRadius, 0, Math.PI * 2);
                ctx.fill();
            });
            
            // Draw draggable point
            ctx.fillStyle = '#ff6b6b';
            ctx.beginPath();
            ctx.arc(draggablePoint.x, draggablePoint.y, pointRadius + 2, 0, Math.PI * 2);
            ctx.fill();
        }
        
        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            if (Math.hypot(x - draggablePoint.x, y - draggablePoint.y) < pointRadius + 5) {
                isDragging = true;
                originalPoint = { ...draggablePoint };
            }
        });
        
        canvas.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            draggablePoint = { x, y };
            draw();
        });
        
        canvas.addEventListener('mouseup', () => {
            if (isDragging) {
                const nearest = findNearestGridPoint(draggablePoint.x, draggablePoint.y);
                draggablePoint = nearest || originalPoint;
                isDragging = false;
                draw();
            }
        });
        
        draw();
    </script>
</body>
</html>
