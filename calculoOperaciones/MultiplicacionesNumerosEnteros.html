<!DOCTYPE html>
<html lang="es">

<head>  
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prueba de Cálculo Numérico Diseñada desde Cero</title>    
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background:rgb(240, 191, 191);
        }
        #output {
            margin-top: 20px;
            white-space: pre-wrap;
            font-family: monospace;
        }
        h1.encabezado {
            margin:auto;
            text-align: center;
            color: #333;
        }

        .contenedor {
            max-width: 600px;
            margin:auto;
            background: #f9f9f9;
            padding: 30px;
            border-radius: 40px;
            box-shadow: 10px 10px 10px rgba(0,0,0,0.1);
        }
        .explicaciones {
            margin: 40px 100px 40px 100px;
        }
        .estadisticas {
            display: flex;
            justify-content: space-around;
            margin-bottom: 30px;
            background: #f5f5f5;
            border-radius: 8px;
            padding: 15px;
        }

        .estadistica{
            text-align: center;
        }
        .etiqueta-estadistica {
            font-size: 14px;
            color: #666;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .valor-estadistica {
            font-size: 24px;
            font-weight: bold;
            margin-top:5px;
        }

        .correctos {
            color: green;
        }   
        .fallos {
            color: red;
        }   
        .total {
            color: blue;
        }
        .ejercicio {
            background: #f6f6f6;
            padding: 20px;
            border-radius: 8px;
        }
        .problema {
            font-size: 24px;
            font-weight: bold;
            color: #333;
            margin-bottom: 15px;
            text-align: center;
        }
        .respuesta {
            display:flex;
            justify-content: center;
            gap:10px;
            text-align: center;
            margin-bottom: 15px;
        }

        input[type="number"] {
            padding: 8px;
            font-size: 16px;
            width: 150px;
            border: 2px solid #ccc;
            border-radius: 5px;
        }
        input[type="number"]:focus {
            border-color: #667eea;
            outline: none;
        }

        button {
            padding: 8px 16px;
            font-size: 16px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }   
        #feedback {
            min-height: 70px; /* Fijo la altura mínima para evitar que se mueva la página */
            text-align: center;
            font-size: 14px;
            font-weight: bold
        }   




        /* lo siguiente es para quitar las flechitas de los input de tipo numero */
        /* Chrome, Safari, Edge, Opera */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        /* Firefox */
        input[type=number] {
         -moz-appearance: textfield;
        }
        
    </style>
</head>
<body>
    
    <div class="explicaciones">
       <!--lo dejo vacío de momento--> 
    </div>
   


    <div class="contenedor">
        <h1>🧮Números enteros: Tablas de multiplicar 🧑‍🎓</h1>
       
        <div class="explicaciones">
            <p>Repaso de la tablas de multiplicación. Elige tipo (al cambiar se reinician los contadores):</p>
            <input type="checkbox" id="multiplicaciones" name="tipoEjercicio" value="" onclick="seleccionaSoloUno(this)" checked>
            <label for="multiplicaciones"> Multiplicaciones (tablas de multiplicar)</label><br>
            <input type="checkbox" id="conNegativos" name="tipoEjercicio" value="" onclick=" seleccionaSoloUno(this)">
            <label for="conNegativos"> También con números negativos </label><br>
            
            
        </div>
        <div class="explicaciones">
            <p>Si prefieres números más grandes (incluyendo 11, 12 y 13):</p>
            <input type="checkbox" id="numerosAltos" name="numerosAltos" value="" onclick="actualizaNumeroMaximo()">
            <label for="numerosAltos"> Números más grandes (se reinician los contadores)</label><br>
        </div>
        <div class="explicaciones">
            
            <button onclick="reiniciar()">Reiniciar </button>
        </div>      


        <div class="estadisticas">
            <div class="estadistica">         
                <div class="etiqueta-estadistica">Aciertos</div>
                <div class="valor-estadistica correctos">0</div>
            </div>
            <div class="estadistica">
                <div class="etiqueta-estadistica">Fallos</div>
                <div class="valor-estadistica fallos">0</div>
            </div>
            <div class="estadistica">
                <div class="etiqueta-estadistica">Total</div>
                <div class="valor-estadistica total">0</div>
            </div>
        </div> <!-- estadisticas -->
        <div class="ejercicio">
            <div class="problema" id="problema">7+3 x 2 
            </div>
            <div class="respuesta">               
                <input type="number" id="repuestaDelUsuario" placeholder="Escribe tu respuesta" autofocus>
                <button onclick="compruebaRespuesta()">Verificar</button>
            </div> <!-- respuesta -->
            <div id="feedback">
                 <p>                
                </p>
            </div> <!-- feedback -->
        </div> <!-- ejercicio -->
    </div> <!-- contenedor -->

    <script >



        let aciertos = 0;
        let fallos = 0;
        let total = 0;
        let respuestaCorrecta = 0;
        let problema =" ";
        let numeroMaximo=10;
        let maxNormal=10;
        let maxAlto=13;
        let multiplo=5;
        

        function generarProblema() {
            //Determino el ejercicio según la selección del usuario
            let i;
            const tipoProblema = [
                generaEjerciciosMultiplicacion,
                generaEjerciciosMultiplicacionConNegativos
                //generaProblemaParentesis,
                //generaCorchetesDivisiones
                //generaProblemaDivision 
            ];

            document.getElementById('repuestaDelUsuario').focus();

            if(document.getElementById('multiplicaciones').checked){
                i = 0
            }
            else if (document.getElementById('conNegativos').checked){
                i = 1;                
            }
            

            /* Esto es para elegir entre varias opciones. De momento solo hay dos funciones.
            
            
            if(document.getElementById('multiplicaciones').checked){
                i = 0
            }
            else if (document.getElementById('conParentesis').checked){
                i = 1;                
            }
            
            else if (document.getElementById('conDivisionesCorchetes').checked){
                i = 2;
            }
            else if (document.getElementById('deTodoUnPoco').checked){
              i = Math.floor(Math.random() * tipoProblema.length);
            }
            else {
                i = Math.floor(Math.random() * tipoProblema.length);
            }   
           */        
                   
            tipoProblema[i]();
            const {problema, respuestaCorrecta} = tipoProblema[i]();
            document.getElementById('problema').textContent = problema;
            return{problema, respuestaCorrecta};

            //Una vez generado el problema, hay que esperar al input del usuario para comprobar la respuesta
            //con la función compruebaRespuesta()
        }

        // Funciones para generar diferentes tipos de problemas
        function generaEjerciciosMultiplicacion() {  
            if(document.getElementById('numerosAltos').checked){
                numeroMaximo = maxAlto;
            } else {
                numeroMaximo = maxNormal;
            }        
            let a = Math.floor(Math.random() * numeroMaximo) +1;
            let b = Math.floor(Math.random() * numeroMaximo) +1;           
                    
            
             const posibilidades = [
                {problema: `${a} × ${b}`, respuestaCorrecta: a * b }
                /*
                De momento solo hay un tipo simple de multiplicación
                {problema: `-${d} - ${a} × (${b} - ${c}) - ${e}` , respuestaCorrecta: -d - a * (b - c) - e} ,
                { problema: `${a} + ${b} × ${c}`, respuestaCorrecta: a + (b * c) },
                { problema: `${a} - ${b} × ${c} + ${e}`, respuestaCorrecta: a - (b * c) + e },
                { problema: `${a} × (-${b}) - ${c}`, respuestaCorrecta: a * (-b) - c },
                { problema: `${a} × (${b} + ${c})`, respuestaCorrecta: a * (b + c) },
                { problema: `${a} × (${b} - ${c})`, respuestaCorrecta: a * (b - c) },
                { problema: `-${a} × (${b} - ${c}) + ${e}`, respuestaCorrecta: -a * (b - c) + e },
                { problema: `-${a} × (-${b} + ${c}) + ${d}`, respuestaCorrecta: -a * (-b + c) + d },
                { problema: `-${a} × (${b} - ${c}) - ${d}`, respuestaCorrecta: -a * (b - c) - d },
                { problema: `-${d} - ${a} × (${b} - ${c}) - ${e}`, respuestaCorrecta: -d - a * (b - c) - e }   
                 */                        

            ];

            const ejercicio = posibilidades[Math.floor(Math.random() * posibilidades.length)];
            problema = ejercicio.problema;
            respuestaCorrecta = ejercicio.respuestaCorrecta;
                        
            return{problema, respuestaCorrecta};
        }

        function generaEjerciciosMultiplicacionConNegativos() {  
            if(document.getElementById('numerosAltos').checked){
                numeroMaximo = maxAlto;
            } else {
                numeroMaximo = maxNormal;
            }        
            let a = Math.floor(Math.random() * numeroMaximo) +1;
            let b = Math.floor(Math.random() * numeroMaximo) +1;           
                
            
             const posibilidades = [
                {problema: `${a} × ${b}`, respuestaCorrecta: a * b },
                {problema: `(-${a}) × ${b}`, respuestaCorrecta:- a * b },
                {problema: `${a} × (-${b})`, respuestaCorrecta: - a * b },
                {problema: `(-${a}) × (-${b})`, respuestaCorrecta: a * b }


                /*
                De momento solo hay un tipo simple de multiplicación
                {problema: `-${d} - ${a} × (${b} - ${c}) - ${e}` , respuestaCorrecta: -d - a * (b - c) - e} ,
                { problema: `${a} + ${b} × ${c}`, respuestaCorrecta: a + (b * c) },
                { problema: `${a} - ${b} × ${c} + ${e}`, respuestaCorrecta: a - (b * c) + e },
                { problema: `${a} × (-${b}) - ${c}`, respuestaCorrecta: a * (-b) - c },
                { problema: `${a} × (${b} + ${c})`, respuestaCorrecta: a * (b + c) },
                { problema: `${a} × (${b} - ${c})`, respuestaCorrecta: a * (b - c) },
                { problema: `-${a} × (${b} - ${c}) + ${e}`, respuestaCorrecta: -a * (b - c) + e },
                { problema: `-${a} × (-${b} + ${c}) + ${d}`, respuestaCorrecta: -a * (-b + c) + d },
                { problema: `-${a} × (${b} - ${c}) - ${d}`, respuestaCorrecta: -a * (b - c) - d },
                { problema: `-${d} - ${a} × (${b} - ${c}) - ${e}`, respuestaCorrecta: -d - a * (b - c) - e }   
                 */                        

            ];

            const ejercicio = posibilidades[Math.floor(Math.random() * posibilidades.length)];
            problema = ejercicio.problema;
            respuestaCorrecta = ejercicio.respuestaCorrecta;
                        
            return{problema, respuestaCorrecta};
        }
        

        
        
        function compruebaRespuesta() {
            const respuestaUsuario = parseInt(document.getElementById('repuestaDelUsuario').value);
            const feedback = document.getElementById('feedback');

            total++;
            if(isNaN(respuestaUsuario)) {
                feedback.innerHTML = '<p style="color:red;">Por favor, introduce un número válido.</p>';
                document.getElementById('repuestaDelUsuario').value = '';
                document.getElementById('repuestaDelUsuario').focus();
                total--; // No contar como intento
                return;
            }
            if (respuestaUsuario === respuestaCorrecta) {
                aciertos++;
                feedback.innerHTML = `<p style="color:green;"> ✓ ¡Correcto!   ${problema} = ${respuestaCorrecta}</p>`;
            } else {
                fallos++;
                feedback.innerHTML = `<p style="color:red;"> ✗ Incorrecto. La respuesta correcta a ${problema} es ${respuestaCorrecta}.</p>`;
            }
            actualizarEstadisticas();
            generarProblema();
            document.getElementById('repuestaDelUsuario').value = '';
        }

        function actualizarEstadisticas() {
            document.querySelector('.valor-estadistica.correctos').textContent = aciertos;
            document.querySelector('.valor-estadistica.fallos').textContent = fallos;
            document.querySelector('.valor-estadistica.total').textContent = total;
        }

        document.getElementById('repuestaDelUsuario').addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                compruebaRespuesta();
            }
        });
        function seleccionaSoloUno(checkbox) {
            var checkboxes = document.getElementsByName(checkbox.name);
            
            checkboxes.forEach((item) => {
            if (item !== checkbox) item.checked = false
                })  
            reiniciar();         
        }

        function actualizaNumeroMaximo() {
            //Esta función no hace falta que genere de nuevo el problema, solo cambia el número máximo
            if(document.getElementById('numerosAltos').checked){
                numeroMaximo = maxAlto;
            } else {
                numeroMaximo = maxNormal;
            } 
            reiniciar();       
        }   
        //comprobar bien eso:
        function reiniciar() {
            aciertos = 0;
            fallos = 0;
            total = 0;
            actualizarEstadisticas();
            generarProblema();
            document.getElementById('repuestaDelUsuario').value = '';
            document.getElementById('feedback').innerHTML = '';
            //generarProblema();
        }

        // Generar el primer problema al cargar la página
        generarProblema();
    </script>
</body>
