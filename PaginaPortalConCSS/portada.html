<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Principal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 20px;
            text-align: center;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        nav {
            background-color: rgba(0, 0, 0, 0.9);
            padding: 0;
        }

        nav ul {
            list-style: none;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
        }

        nav ul li {
            margin: 0;
        }

        nav ul li a {
            display: block;
            color: white;
            text-decoration: none;
            padding: 15px 25px;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        nav ul li a:hover {
            background-color: #667eea;
            transform: scale(1.05);
        }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .content {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 600px;
        }

        .content h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 2em;
        }

        .content p {
            color: #333;
            line-height: 1.6;
            font-size: 1.1em;
        }

        footer {
            background-color: rgba(0, 0, 0, 0.8);
            color: white;
            text-align: center;
            padding: 20px;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <header>
        <h1>Portal Principal</h1>
        <p>Bienvenido a nuestro sitio</p>
    </header>

    <nav>
        <ul>
            <li><a href="seccion1.html">Sección 1</a></li>
            <li><a href="seccion2.html">Sección 2</a></li>
            <li><a href="seccion3.html">Sección 3</a></li>
            <li><a href="seccion4.html">Sección 4</a></li>
            <li><a href="seccion5.html">Sección 5</a></li>
        </ul>
    </nav>

    <main>
        <div class="content">
            <h2>Bienvenido</h2>
            <p>Selecciona una sección del menú superior para explorar nuestro contenido.</p>
        </div>
    </main>

    <footer>
        <p>&copy; 2024 Portal Principal. Todos los derechos reservados.</p>
    </footer>
</body>
</html>
