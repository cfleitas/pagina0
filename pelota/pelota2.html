<!DOCTYPE html>
<html>
    <head>
        <title>Pelota Rebotando en DIV</title>
        
        <style>            
            #contenedor {
                position: relative;
                width: 50vw;
                height: 50vh;
                border: 2px solid black;
                top: 50%;
                left: 50%;
                transform: translate(-50%, 50%);                
            }

            #pelota {
                position: absolute;
                left: 100px;
                top: 150px;
            } 
        </style>
        <script src="pelota2.js">  </script> 
    </head>
    <body>
     <div id="contenedor">
         <img id="pelota" src="bolaRoja.png"/>
     </div>

    </body>
</html>
