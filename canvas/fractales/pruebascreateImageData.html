<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conjunto de Mandelbrot - Zoom Interactivo</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #1a1a1a;
            color: #fff;
            font-family: Arial, sans-serif;
        }
        h1 {
            margin-bottom: 10px;
        }
        #canvas {
            border: 2px solid #fff;
            cursor: crosshair;
            display: block;
            background-color: #000;
        }
        .info {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
        }
        .controls {
            margin-top: 15px;
            display: flex;
            gap: 10px;
        }
        button {
            padding: 10px 20px;
            background-color: #0066cc;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }
        button:hover {
            background-color: #0052a3;
        }
    </style>
</head>
<body>
    <h1>PRUEBAS CON CREATEIMAGEdATA</h1>
    <canvas id="canvas" width="800" height="600"></canvas>
    <div class="info">
        <p>Haz clic y arrastra para seleccionar un área y hacer zoom</p>
        <p id="coordinates">Coordenadas: X: 0, Y: 0</p>
    </div>
    

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');     

            

        

        function pixelToComplex(pixelX, pixelY) {
            const realRange = mandelbrotParams.maxReal - mandelbrotParams.minReal;
            const imagRange = mandelbrotParams.maxImaginary - mandelbrotParams.minImaginary;
            return {
                real: mandelbrotParams.minReal + (pixelX / canvas.width) * realRange,
                //comento la línea siguiente y habilito la de abajo para invertir el eje Y
                //imaginary: mandelbrotParams.minImaginary + (pixelY / canvas.height) * imagRange
                imaginary: mandelbrotParams.maxImaginary - (pixelY / canvas.height) * imagRange
            };
        }


        

        function draw() {
            const imageData = ctx.createImageData(canvas.width, canvas.height);
            const data = imageData.data;

            for (let y = 0; y < canvas.height/2; y++) {
                for (let x = 0; x < canvas.width; x++) {
                    const index = (y * canvas.width + x) * 4;
                    data[index] = 255;
                    data[index + 1] = 0;
                    data[index + 2] = 0;
                    data[index + 3] = 255;
                }
            }

            for (let y = canvas.height/2; y < canvas.height; y++) {
                for (let x = 0; x < canvas.width; x++) {
                    const index = (y * canvas.width + x) * 4;
                    data[index] = 0;
                    data[index + 1] = 0;
                    data[index + 2] = 255;
                    data[index + 3] = 255;
                }
            }

            for (let y = canvas.height/2-20; y < canvas.height/2+20; y++) {
                for (let x = 0; x < canvas.width; x++) {
                    const index = (y * canvas.width + x) * 4;
                    data[index] = 0;
                    data[index + 1] = 255;
                    data[index + 2] = 0;
                    data[index + 3] = 255;
                }
            }


            ctx.putImageData(imageData, 0, 0);
        }

        function getColor(iterations, maxIterations) {
            if (iterations === maxIterations) {
                return { r: 0, g: 0, b: 0 };
            }
            const hue = (iterations / maxIterations) * 360;
            const rgb = hslToRgb(hue, 100, 50);
            return { r: rgb[0], g: rgb[1], b: rgb[2] };
        }

        function hslToRgb(h, s, l) {
            s /= 100;
            l /= 100;
            const k = n => (n + h / 30) % 12;
            const a = s * Math.min(l, 1 - l);
            const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
            return [
                Math.round(255 * f(0)),
                Math.round(255 * f(8)),
                Math.round(255 * f(4))
            ];
        }

        

    draw();


        
    </script>
</body>
</html>
