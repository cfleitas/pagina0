<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triángulo de Pascal: coloreando en función de que los números sean divisibles entre n o no</title>
    <style>
        body {
            
            justify-content: center;
            align-items: center;
            
            margin: 0;
            background-color: #ecdfdf;
            font-family: Arial, sans-serif;
        }
        canvas {
            border: 2px solid #fff;
            background-color: #000;
        }
        #controls {
            
            color: #070707;
        }
        input {
            margin: 5px;
            padding: 5px;
        }
    </style>
</head>
<body>

    <h1>Triángulo de Pascal: coloreando en función de que los números sean divisibles entre n o no</h1>
    <p>Se usan solo dos colores</p>
    


    
        <div style="width:300px; border:2px solid rgb(27, 4, 4); margin:auto; display:block">
        <label >Módulo: <input type="number" id="modulo" value="2" min="2"></label>
        <button onclick="redraw()">Dibujar</button>         
         </div>

        <div style="width:300px; border:2px solid rgb(238, 18, 18); margin:auto; display:block">
            <lable>Número de filas:</lable>
            <input type="range" id="nrFilas" min="100" max="600" value="400" step="1"/>
        <span id= "filas">400</span> 
        </div>

        <div style="width:300px; border:2px solid rgb(238, 18, 18); margin:auto; display:block">
            <lable>Tamaño de los puntos:</lable>
            <input type="range" id="tamanioRectangulos" min="2" max="4" value="3" step="1"/>
        <span id= "tamanio">3</span> 
        </div>

   
    <canvas id="canvas" width="1000" height="1000" style="border:1px saddlebrown ;margin:auto; display:block "></canvas>
    
    <h2>Observaciones adicionales:</h2>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        var rows=document.getElementById('nrFilas').value;
        var modulo= parseInt(document.getElementById('modulo').value) ;
        var pixelSize= parseInt(document.getElementById('tamanioRectangulos').value);


        // añadimos el listener para el control del valor del módulo
        document.getElementById('modulo').addEventListener('change', redraw);

        //añadimos el listener para el control del número de filas a mostrar
        document.getElementById('nrFilas').addEventListener('input', function() {
            rows = parseInt(this.value);
            document.getElementById('filas').textContent = rows;
            redraw();
        });
        
        //listener para el tamaño de los rectángulos:
        document.getElementById('tamanioRectangulos').addEventListener('input', function() {
            pixelSize = parseInt(this.value);
            document.getElementById('tamanio').textContent = pixelSize;
            redraw();
        });

        function calcularTrianguloPascalModular(n, modulo) {
            const triangulo = [];
            for (let i = 0; i < n; i++) {
                triangulo[i] = [];
                for (let j = 0; j <= i; j++) {
                    if (j === 0 || j === i) {
                        triangulo[i][j] = 1 % modulo;
                    } else {
                        triangulo[i][j] = (triangulo[i - 1][j - 1] + triangulo[i - 1][j]) % modulo;
                    }
                }
            }
            return triangulo;
        }   

        function calculaColor(valor) {
            const resto = valor % modulo;
            if(resto === 0){
                return '#000000'; // negro
            } else {
                return '#FFFFFF'; // blanco 
            }
            
        }   




        function redraw() {
            modulo= parseInt(document.getElementById('modulo').value) || 2;
            const triangulo = calcularTrianguloPascalModular(rows, modulo);
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            pixelSize = document.getElementById('tamanioRectangulos').value ;
            const startX = canvas.width / 2;
            const startY = 20;

            triangulo.forEach((row, rowIndex) => {
                row.forEach((value, colIndex) => {
                    const color = calculaColor(value);
                    const x = startX + (colIndex - rowIndex / 2) * pixelSize;
                    const y = startY + rowIndex * pixelSize;

                    ctx.fillStyle = color;
                    ctx.fillRect(x, y, pixelSize - 1, pixelSize - 1);
                });
            });
        }   

        redraw();
        
    </script>
</body>
</html>
