<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triángulo de Pascal</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        #output {
            margin-top: 20px;
            white-space: pre-wrap;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <h1>Triángulo de Pascal</h1>
    <label for="filas">Número de filas:</label>
    <input type="number" id="filas" value="10" min="1">
    <button onclick="generaTriangulo()">Generate</button>
    <div id="output" style=" width:90%; border:1px solid red;   margin:auto; display:block"   ></div>

    <canvas id="canvas" style="width:800px; height:800px; border:1px solid #000000;  margin:auto; display:block;"></canvas>

    <script>
        function generaTriangulo() {
            const numFilas = parseInt(document.getElementById('filas').value);
            const triangulo = [];

            for (let i = 0; i < numFilas; i++) {
                triangulo[i] = [];
                for (let j = 0; j <= i; j++) {
                    if (j === 0 || j === i) {
                        triangulo[i][j] = 1;
                    } else {
                        triangulo[i][j] = triangulo[i - 1][j - 1] + triangulo[i - 1][j];
                        triangulo[i][j]= triangulo[i][j]%3; // Módulo 3
                    }
                }
            }

            displaytriangulo(triangulo);
            console.log(triangulo);
        }

        function displaytriangulo(triangulo) {
            let output = '';
            triangulo.forEach(row => {
                //esta es la sentencia inicial y va bien:                
               //output += row.join(' ') + '\n';
               output += row.join('') + '\n';
            });

           
            const elTexto=document.getElementById('output');
                //output= output.replace(/ /g, '\u00A0'); // Espacios no separables para mantener la alineación
                
               
                
                //Las tres líneas siguientes son para sustituir por emojis, pero no sé si funcionan bien en todos los navegadores
                //output=output.replace(/1/g, '🔴') ;
                //output= output.replace(/0/g, '⚪');
                //output= output.replace(/2/g, '🔵')  ;

           
            
            
           
             
           output = output.replace(/0/g, '<span style="background-color: red;">0</span>');
           output = output.replace(/1/g, '<span style="background-color: blue;">1</span>');
           output = output.replace(/2/g, '<span style="background-color: black;">2</span>');           

            elTexto.innerHTML= output; 
        }

        generaTriangulo();
    </script>
</body>
</html>
